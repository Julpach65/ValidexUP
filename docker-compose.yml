# ===================================================================
# Docker Compose: Validex UP - Orquestador Zero-Trust con Proxy
# ===================================================================

services:

  # 1. PROXY INVERSO (CADDY) - Escudo Frontal
  caddy:
    image: caddy:2
    container_name: validex_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - validex_proxy_net
    depends_on:
      - frontend
      - backend

  # 2. BASE DE DATOS MySQL (Red Privada)
  mysql:
    image: mysql:8.0
    container_name: validex_mysql
    command: --lower_case_table_names=1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ValidexSecure2026}
      MYSQL_DATABASE: validexdb
      MYSQL_USER: ${DB_USER:-validexuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ValidexSecure2026}
    volumes:
      - validex_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - validex_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-ValidexSecure2026}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 3. BACKEND FastAPI 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: validex_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER:-validexuser}:${DB_PASSWORD:-ValidexSecure2026}@mysql:3306/validexdb
    networks:
      - validex_internal
      - validex_proxy_net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # 4. FRONTEND Next.js
  frontend:
    build:
      context: ./validex_ui
      dockerfile: Dockerfile
      target: production
    container_name: validex_frontend
    restart: unless-stopped
    networks:
      - validex_proxy_net
    depends_on:
      backend:
        condition: service_healthy

networks:
  validex_internal:
    driver: bridge
    internal: true
    name: validex_internal_net
  validex_proxy_net:
    driver: bridge
    name: validex_proxy_net

volumes:
  validex_mysql_data:
    name: validex_mysql_data
